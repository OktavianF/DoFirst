<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Your Password - DoFirst</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Securely reset your password for your DoFirst task management account.">
  <link rel="icon" type="image/png" href="https://pxsqfmopmanjurremyez.supabase.co/storage/v1/object/public/avatars/logo-persegi.png">

  <!-- Google Fonts: Lexend -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0B0F19;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #4F46E5;
      --primary-hover: #3525CD;
      --text-primary: #FFFFFF;
      --text-secondary: #94A3B8;
      --error: #EF4444;
      --success: #10B981;
      --glow-mint: rgba(108, 248, 187, 0.15);
      --glow-indigo: rgba(79, 70, 229, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Lexend', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Elegant Glowing Background Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -1;
    }

    .orb-indigo {
      width: 400px;
      height: 400px;
      background: var(--glow-indigo);
      top: -100px;
      right: -100px;
    }

    .orb-mint {
      width: 350px;
      height: 350px;
      background: var(--glow-mint);
      bottom: -80px;
      left: -80px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 24px;
      z-index: 1;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 40px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
    }

    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .logo {
      height: 48px;
      width: auto;
    }

    .header-text {
      text-align: center;
      margin-bottom: 32px;
    }

    .header-text h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .header-text p {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      color: var(--text-primary);
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      background: rgba(255, 255, 255, 0.07);
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
    }

    .btn-submit {
      width: 100%;
      padding: 14px 24px;
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      background: #3B4252;
      color: #8C96A8;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Spinner Animation */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Message Boxes */
    .message {
      padding: 14px 20px;
      border-radius: 16px;
      font-size: 14px;
      margin-bottom: 24px;
      display: none;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #FCA5A5;
      display: block;
    }

    .message.success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #A7F3D0;
      display: block;
    }

    .success-view {
      display: none;
      text-align: center;
      animation: fadeIn 0.4s ease;
    }

    .success-icon {
      width: 72px;
      height: 72px;
      background: rgba(16, 185, 129, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: var(--success);
    }

    .success-icon svg {
      width: 36px;
      height: 36px;
    }

    .btn-redirect {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 28px;
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-redirect:hover {
      background: var(--primary);
      color: #FFFFFF;
    }
  </style>
</head>
<body>

  <!-- Background Decorative Orbs -->
  <div class="orb orb-indigo"></div>
  <div class="orb orb-mint"></div>

  <div class="container">
    <!-- Form Card -->
    <div class="card" id="formCard">
      <div class="logo-container">
        <!-- SVG Custom Premium Logo -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="logo" fill="none">
          <circle cx="50" cy="50" r="46" fill="#4F46E5"/>
          <path d="M32 50L44 62L68 38" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="header-text">
        <h1>New Password</h1>
        <p>Set a strong password for your DoFirst account</p>
      </div>

      <!-- Error / Status Message Banner -->
      <div id="msgBanner" class="message"></div>

      <form id="resetForm" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label for="password">New Password</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              class="form-input" 
              placeholder="Min. 8 characters"
              required 
              minlength="8"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="confirmPassword" 
              class="form-input" 
              placeholder="Repeat your password"
              required
            >
          </div>
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit">
          <span class="spinner" id="btnSpinner"></span>
          <span id="btnText">Update Password</span>
        </button>
      </form>
    </div>

    <!-- Success View -->
    <div class="card success-view" id="successCard">
      <div class="success-icon">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
      <h2>Password Updated!</h2>
      <p style="color: var(--text-secondary); margin-top: 12px; font-size: 14px; line-height: 1.5;">
        Your password has been reset successfully. You can now close this tab and log in from the DoFirst app.
      </p>
      <a href="dofirst://login" class="btn-redirect">Back to App</a>
    </div>
  </div>

  <script>
    // Extract access_token from Supabase redirect (supports both hash fragment & query parameter)
    function getAccessToken() {
      const urlParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      return hashParams.get('access_token') || urlParams.get('access_token');
    }

    const accessToken = getAccessToken();

    // Check if token is available on load
    window.onload = function() {
      const msgBanner = document.getElementById('msgBanner');
      const btnSubmit = document.getElementById('btnSubmit');

      if (!accessToken) {
        msgBanner.className = "message error";
        msgBanner.innerText = "Error: Invalid or expired password reset link. Please request a new one from the app.";
        btnSubmit.disabled = true;
      }
    };

    async function handleSubmit(event) {
      event.preventDefault();
      
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const msgBanner = document.getElementById('msgBanner');
      const btnSubmit = document.getElementById('btnSubmit');
      const btnSpinner = document.getElementById('btnSpinner');
      const btnText = document.getElementById('btnText');

      // Clear previous banner
      msgBanner.style.display = "none";
      msgBanner.className = "message";

      // Validate match
      if (password !== confirmPassword) {
        msgBanner.className = "message error";
        msgBanner.innerText = "Passwords do not match!";
        return;
      }

      if (!accessToken) {
        msgBanner.className = "message error";
        msgBanner.innerText = "Access token is missing. Please re-open the link from your email.";
        return;
      }

      // Enter loading state
      btnSubmit.disabled = true;
      btnSpinner.style.display = "block";
      btnText.innerText = "Updating...";

      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            password: password,
            accessToken: accessToken
          })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          // Hide form, show gorgeous success view
          document.getElementById('formCard').style.display = "none";
          document.getElementById('successCard').style.display = "block";
        } else {
          // Display api error
          msgBanner.className = "message error";
          msgBanner.innerText = result.error || "Failed to reset password. Please try again.";
          
          // Reset loading state
          btnSubmit.disabled = false;
          btnSpinner.style.display = "none";
          btnText.innerText = "Update Password";
        }
      } catch (err) {
        msgBanner.className = "message error";
        msgBanner.innerText = "A network error occurred. Please check your internet connection and try again.";
        
        // Reset loading state
        btnSubmit.disabled = false;
        btnSpinner.style.display = "none";
        btnText.innerText = "Update Password";
      }
    }
  </script>
</body>
</html>
